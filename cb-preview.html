<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Create Believers Preview</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" />
    <style>
      :root { color-scheme: light; }
      body { margin: 0; background: #faf4ea; color: #2b2723; font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif; }
      * { box-sizing: border-box; }
      .cbp-bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: center; padding-block: 9px;
        padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: #16203a; font-size: 13.5px; }
      .cbp-bar span { color: #e3c88d; font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; font-weight: 500; }
      .cbp-bar a { color: #faf4ea; text-decoration: none; padding: 3px 0; border-bottom: 2px solid transparent; }
      .cbp-bar a[aria-current='page'] { border-bottom-color: #e3c88d; }
      .cbp-bar a:focus-visible { outline: 2px solid #e3c88d; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/create-believers/preview-main.tsx"></script>
  </body>
</html>
